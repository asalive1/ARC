services:
  api:
    environment:
      ARC_ADMIN_BOOTSTRAP_TOKEN_FILE: /run/secrets/admin_bootstrap_token
      ARC_ADMIN_RECOVERY_TOKEN_FILE: /run/secrets/admin_recovery_token
    secrets:
      - admin_bootstrap_token
      - admin_recovery_token

secrets:
  admin_bootstrap_token:
    file: ${ARC_ADMIN_BOOTSTRAP_TOKEN_FILE_SOURCE:?Set ARC_ADMIN_BOOTSTRAP_TOKEN_FILE_SOURCE}
  admin_recovery_token:
    file: ${ARC_ADMIN_RECOVERY_TOKEN_FILE_SOURCE:?Set ARC_ADMIN_RECOVERY_TOKEN_FILE_SOURCE}
