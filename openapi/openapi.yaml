openapi: 3.1.0
info:
  title: ARC API
  version: 1.0.0
  description: Phase 1 media profile planning and catalog API.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API and its PostgreSQL database are ready
      responses:
        "200":
          description: The API and PostgreSQL database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /system/capabilities:
    get:
      operationId: getSystemCapabilities
      summary: Read API and registered worker capabilities
      responses:
        "200":
          description: Capability snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /network/interfaces:
    get:
      operationId: listNetworkInterfaces
      summary: List interfaces discovered by registered workers
      responses:
        "200":
          description: Discovered interface inventory.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NetworkInterface"
  /sources:
    get:
      operationId: listSources
      summary: List configured sources
      responses:
        "200":
          description: Source collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: createSource
      summary: Create a disabled source draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /sources/{sourceId}:
    put:
      operationId: updateSource
      summary: Edit a disabled source as a new draft revision
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "200":
          description: The updated source; previous revisions are preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /sources/{sourceId}/validate:
    post:
      operationId: validateSourceDraft
      summary: Validate a source draft
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The source draft is now validated and remains disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /destinations:
    get:
      operationId: listDestinations
      summary: List configured destinations
      responses:
        "200":
          description: Destination collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
    post:
      operationId: createDestination
      summary: Create a disabled destination draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDestinationRequest"
      responses:
        "201":
          description: Destination draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /destinations/{destinationId}:
    put:
      operationId: updateDestination
      summary: Edit a disabled destination as a new draft revision
      parameters:
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDestinationRequest"
      responses:
        "200":
          description: The updated destination; previous revisions are preserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /destinations/{destinationId}/validate:
    post:
      operationId: validateDestinationDraft
      summary: Validate a destination draft
      parameters:
        - name: destinationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The destination draft is now validated and remains disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /routes/plan:
    post:
      operationId: planRoute
      summary: Plan a route using a supported Phase 1 media path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePlanRequest"
      responses:
        "200":
          description: The compatible media path and its provisional resource estimate. No capacity is checked or reserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePlan"
        "422":
          $ref: "#/components/responses/ApiError"
  /routes/plan-assignment:
    post:
      operationId: planRouteAssignment
      summary: Reserve capacity and create a revision-pinned planned assignment
      description: This control-plane operation checks worker eligibility and capacity, then atomically persists a reservation and planned assignment. It does not activate or execute the route. Worker heartbeats must be no older than the server-controlled 30-second limit. Retries with the same Idempotency-Key and request body replay the original result for 24 hours; reusing a key with a different body returns 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A non-nil client-generated UUID retained for 24 hours to safely replay this planning request.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRouteAssignmentRequest"
      responses:
        "200":
          description: The assignment was planned, or no eligible worker had capacity. An unavailable result creates no reservation or assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRouteAssignmentResult"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: A requested endpoint revision is stale or unvalidated, the pipeline already has an assignment, or the Idempotency-Key was reused with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /pipelines/{pipelineId}/assignment:
    get:
      operationId: getPipelineAssignment
      summary: Read the latest assignment generation for a pipeline
      description: Returns assignment identity, pinned route snapshot, and current desired/observed states, including cancelled assignments for uncertain-outcome reconciliation.
      parameters:
        - name: pipelineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The latest assignment generation for the pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSnapshot"
        "404":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /assignments/{assignmentId}/cancel:
    post:
      operationId: cancelUnstartedAssignment
      summary: Cancel an unstarted planned assignment
      description: Requires the assignment generation as a fencing check. Only planned assignments still observed as not_started can be cancelled; cancellation atomically releases the capacity reservation. Repeating cancellation for the same already-cancelled generation is idempotent. It does not stop starting/running media or disable resources used by another active assignment.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAssignmentRequest"
      responses:
        "200":
          description: The unstarted assignment was cancelled and its reservation released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelAssignmentResult"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: The assignment is no longer in the requested generation or is not unstarted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /assignments/{assignmentId}/start:
    post:
      operationId: startPlannedAssignment
      summary: Start a revision-pinned planned assignment
      description: Requires the exact assignment generation. This lifecycle action atomically persists the starting state and enables the pinned source and destination before dispatching a Start command built from the stored route snapshot. Repeating the request for an already-running assignment is idempotent.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAssignmentRequest"
      responses:
        "200":
          description: The worker acknowledged the Start command and the assignment is running, or it was already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSnapshot"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: The generation or lifecycle state does not permit starting the assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "503":
          description: The worker is unavailable. The assignment remains retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: The worker did not acknowledge the command before timeout; inspect the assignment snapshot before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /assignments/{assignmentId}/stop:
    post:
      operationId: stopAssignment
      summary: Stop a running assignment
      description: Requires the exact assignment generation. This lifecycle action persists stopped/stopping before dispatching Stop. Source and destination resources remain enabled while stopping; after worker acknowledgement, resources unused by other active assignments are disabled in the same transaction that releases capacity. Failed or uncertain dispatch leaves the assignment retryable in stopping. Repeating Stop for a stopping assignment reuses the same command identity.
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopAssignmentRequest"
      responses:
        "200":
          description: The worker acknowledged Stop and the reservation was released, or the assignment was already stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSnapshot"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: The generation or lifecycle state does not permit stopping the assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "503":
          description: The worker is unavailable. The assignment remains in stopping with its reservation held so Stop can be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/responses/ApiError"
        "504":
          description: The worker did not acknowledge before timeout. The assignment remains in stopping with its reservation held.
          content:
            application/json:
              schema:
                $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /routes:
    get:
      operationId: listRoutes
      summary: List desired and observed route state
      responses:
        "200":
          description: Route collection.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Route"
  /routes/validate:
    post:
      operationId: validateRoute
      summary: Validate a proposed route without applying it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteProposal"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Request or domain error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ApiError:
      description: Invalid request or catalog failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: alive
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ready, unavailable]
    Capabilities:
      type: object
      required: [apiVersion, workers]
      properties:
        apiVersion:
          type: string
        workers:
          type: array
          items:
            type: object
            required: [workerId, state, capabilities]
            properties:
              workerId:
                type: string
                format: uuid
              state:
                type: string
              capabilities:
                type: object
                additionalProperties: true
    NetworkInterface:
      type: object
      required: [stableId, name, addresses, linkUp, administrativeUp, multicastCapable]
      properties:
        stableId:
          type: string
        name:
          type: string
        addresses:
          type: array
          items:
            type: string
            format: ip-address
        mtu:
          type: integer
          minimum: 1
        linkUp:
          type: boolean
        administrativeUp:
          type: boolean
        multicastCapable:
          type: boolean
        linkSpeedBitsPerSecond:
          type: integer
          minimum: 0
    CreateSourceRequest:
      type: object
      required: [friendlyName, profile]
      properties:
        friendlyName:
          type: string
          minLength: 1
          maxLength: 120
        profile:
          $ref: "#/components/schemas/SourceMediaProfile"
    CreateDestinationRequest:
      type: object
      required: [friendlyName, profile]
      properties:
        friendlyName:
          type: string
          minLength: 1
          maxLength: 120
        profile:
          $ref: "#/components/schemas/DestinationMediaProfile"
    Source:
      type: object
      required:
        [id, friendlyName, sourceType, desiredState, currentRevision, revisionId, lifecycle, configuration]
      properties:
        id:
          type: string
          format: uuid
        friendlyName:
          type: string
        sourceType:
          type: string
        desiredState:
          type: string
          enum: [disabled, enabled]
          description: Enabled while at least one active assignment uses the resource.
        currentRevision:
          type: integer
          minimum: 1
        revisionId:
          type: string
          format: uuid
        lifecycle:
          type: string
          enum: [draft, validated]
        configuration:
          $ref: "#/components/schemas/SourceMediaProfile"
    Destination:
      type: object
      required:
        [id, friendlyName, destinationType, desiredState, currentRevision, revisionId, lifecycle, configuration]
      properties:
        id:
          type: string
          format: uuid
        friendlyName:
          type: string
        destinationType:
          type: string
        desiredState:
          type: string
          enum: [disabled, enabled]
          description: Enabled while at least one active assignment uses the resource.
        currentRevision:
          type: integer
          minimum: 1
        revisionId:
          type: string
          format: uuid
        lifecycle:
          type: string
          enum: [draft, validated]
        configuration:
          $ref: "#/components/schemas/DestinationMediaProfile"
    SourceMediaProfile:
      description: RTP L16/L24 use 48 kHz stereo linear PCM and endpoint-local dynamic payload types. RTP MP2T is retained for existing source records.
      oneOf:
        - type: object
          required: [kind, device]
          properties:
            kind:
              type: string
              const: alsa_l16
            device:
              type: string
        - type: object
          required: [kind, host, port, mode]
          properties:
            kind:
              type: string
              const: srt_mpeg_ts
            host:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            mode:
              type: string
              enum: [caller, listener]
        - type: object
          required: [kind, bindAddress, port]
          properties:
            kind:
              type: string
              const: rtp_mp2t
            bindAddress:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
        - type: object
          required: [kind, bindAddress, port, payloadType]
          properties:
            kind:
              type: string
              const: rtp_l16
            bindAddress:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            payloadType:
              type: integer
              minimum: 96
              maximum: 127
        - type: object
          required: [kind, bindAddress, port, payloadType]
          properties:
            kind:
              type: string
              const: rtp_l24
            bindAddress:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            payloadType:
              type: integer
              minimum: 96
              maximum: 127
    DestinationMediaProfile:
      description: RTP L24 uses 48 kHz stereo linear PCM and an endpoint-local dynamic payload type.
      oneOf:
        - type: object
          required: [kind, address, port, payloadType]
          properties:
            kind:
              type: string
              const: rtp_l16
            address:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            payloadType:
              type: integer
              minimum: 96
              maximum: 127
        - type: object
          required: [kind, address, port, payloadType]
          properties:
            kind:
              type: string
              const: rtp_l24
            address:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            payloadType:
              type: integer
              minimum: 96
              maximum: 127
        - type: object
          required: [kind, host, port, mode]
          properties:
            kind:
              type: string
              const: srt_mpeg_ts
            host:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            mode:
              type: string
              enum: [caller, listener]
    RoutePlanRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          $ref: "#/components/schemas/SourceMediaProfile"
        destination:
          $ref: "#/components/schemas/DestinationMediaProfile"
    RoutePlan:
      type: object
      required: [mediaPath, estimate]
      properties:
        mediaPath:
          type: string
          enum:
            [alsa_l16_to_rtp_l16, rtp_l16_to_rtp_l16, rtp_l24_to_rtp_l24, rtp_mp2t_to_srt_mpeg_ts, srt_mpeg_ts_to_srt_mpeg_ts]
        estimate:
          $ref: "#/components/schemas/RouteResourceEstimate"
    PlanRouteAssignmentRequest:
      type: object
      required: [pipelineId, sourceId, sourceRevision, destinationId, destinationRevision]
      properties:
        pipelineId:
          type: string
          format: uuid
          description: Stable client-generated ID for this pipeline. A duplicate pipeline ID with a different idempotency key remains a conflict; use the same key to replay a request after an uncertain outcome.
        sourceId:
          type: string
          format: uuid
        sourceRevision:
          type: integer
          minimum: 1
          description: Expected current source revision; stale revisions are rejected.
        destinationId:
          type: string
          format: uuid
        destinationRevision:
          type: integer
          minimum: 1
          description: Expected current destination revision; stale revisions are rejected.
    PlanRouteAssignmentResult:
      type: object
      required: [state, mediaPath, estimate, assignment, rejections]
      properties:
        state:
          type: string
          enum: [planned, unavailable]
        mediaPath:
          type: string
          enum:
            [alsa_l16_to_rtp_l16, rtp_l16_to_rtp_l16, rtp_l24_to_rtp_l24, rtp_mp2t_to_srt_mpeg_ts, srt_mpeg_ts_to_srt_mpeg_ts]
        estimate:
          $ref: "#/components/schemas/RouteResourceEstimate"
        assignment:
          oneOf:
            - $ref: "#/components/schemas/PlannedAssignment"
            - type: "null"
        rejections:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRejection"
    PlannedAssignment:
      type: object
      required: [id, pipelineId, workerId, generation, reservationId, requirements, route]
      properties:
        id:
          type: string
          format: uuid
        pipelineId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        reservationId:
          type: string
          format: uuid
        requirements:
          type: object
          additionalProperties: true
        route:
          oneOf:
            - $ref: "#/components/schemas/PlannedRouteConfig"
            - type: "null"
    PlannedRouteConfig:
      type: object
      required: [sourceId, sourceRevision, destinationId, destinationRevision, mediaPath, configuration]
      properties:
        sourceId:
          type: string
          format: uuid
        sourceRevision:
          type: integer
          minimum: 1
        destinationId:
          type: string
          format: uuid
        destinationRevision:
          type: integer
          minimum: 1
        mediaPath:
          type: string
        configuration:
          type: object
          additionalProperties: true
    AssignmentSnapshot:
      type: object
      required: [assignment, desiredState, observedState]
      properties:
        assignment:
          $ref: "#/components/schemas/PlannedAssignment"
        desiredState:
          type: string
          description: Controller-desired lifecycle state, such as planned, running or cancelled.
        observedState:
          type: string
          description: Latest worker-observed lifecycle state, such as not_started, starting, running or cancelled.
    CancelAssignmentRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          minimum: 1
          description: Exact generation to cancel; stale generations are rejected.
    CancelAssignmentResult:
      type: object
      required: [assignmentId, generation, state]
      properties:
        assignmentId:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 1
        state:
          type: string
          const: cancelled
    StartAssignmentRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          minimum: 1
          description: Exact assignment generation to start; stale generations are rejected.
    StopAssignmentRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          minimum: 1
          description: Exact assignment generation to stop; stale generations are rejected.
    WorkerRejection:
      type: object
      required: [workerId, reason]
      properties:
        workerId:
          type: string
          format: uuid
        reason:
          oneOf:
            - type: object
              required: [code]
              properties:
                code:
                  type: string
                  enum: [worker_not_accepting, heartbeat_expired, heartbeat_in_future]
            - type: object
              required: [code, details]
              properties:
                code:
                  type: string
                  const: missing_capabilities
                details:
                  type: array
                  items:
                    type: string
            - type: object
              required: [code, details]
              properties:
                code:
                  type: string
                  const: insufficient_capacity
                details:
                  type: object
                  required: [required, available]
                  properties:
                    required:
                      type: integer
                      minimum: 0
                    available:
                      type: integer
                      minimum: 0
    RouteResourceEstimate:
      type: object
      description: Provisional, uncalibrated estimate; not proof of available capacity. Null payload rates are unknown and known rates exclude protocol overhead.
      required: [capacityUnits, ingressPayloadBitsPerSecond, egressPayloadBitsPerSecond]
      properties:
        capacityUnits:
          type: integer
          minimum: 1
          description: Provisional normalized capacity units, not a measured resource limit.
        ingressPayloadBitsPerSecond:
          type: [integer, "null"]
          minimum: 0
          description: Estimated ingress payload rate, or null if unknown.
        egressPayloadBitsPerSecond:
          type: [integer, "null"]
          minimum: 0
          description: Estimated egress payload rate, or null if unknown.
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [invalid_request, not_found, invalid_lifecycle, resource_enabled, database_error, internal_error, stale_route_revision, source_not_validated, destination_not_validated, assignment_conflict, reservation_conflict, invalid_route_revision, invalid_media_profile, invalid_reservation, invalid_pipeline_id]
        message:
          type: string
    RouteProposal:
      type: object
      required: [sourceId, destinationId]
      properties:
        sourceId:
          type: string
          format: uuid
        destinationId:
          type: string
          format: uuid
        expectedRouteRevision:
          type: integer
          minimum: 0
    Route:
      type: object
      required: [destinationId, desiredState, observedState, revision]
      properties:
        destinationId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        desiredState:
          type: string
        observedState:
          type: string
        revision:
          type: integer
          minimum: 0
    ValidationResult:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        arcCode:
          type: string
        correlationId:
          type: string
          format: uuid
