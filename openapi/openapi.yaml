openapi: 3.1.0
info:
  title: ARC API
  version: 1.0.0
  description: Phase 1 media profile planning and catalog API.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        "200":
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /system/capabilities:
    get:
      operationId: getSystemCapabilities
      summary: Read API and registered worker capabilities
      responses:
        "200":
          description: Capability snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /network/interfaces:
    get:
      operationId: listNetworkInterfaces
      summary: List interfaces discovered by registered workers
      responses:
        "200":
          description: Discovered interface inventory.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NetworkInterface"
  /sources:
    get:
      operationId: listSources
      summary: List configured sources
      responses:
        "200":
          description: Source collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: createSource
      summary: Create a disabled source draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Source draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /destinations:
    get:
      operationId: listDestinations
      summary: List configured destinations
      responses:
        "200":
          description: Destination collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
    post:
      operationId: createDestination
      summary: Create a disabled destination draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDestinationRequest"
      responses:
        "201":
          description: Destination draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "422":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /routes/plan:
    post:
      operationId: planRoute
      summary: Plan a route using a supported Phase 1 media path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePlanRequest"
      responses:
        "200":
          description: The compatible media path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePlan"
        "422":
          $ref: "#/components/responses/ApiError"
  /routes:
    get:
      operationId: listRoutes
      summary: List desired and observed route state
      responses:
        "200":
          description: Route collection.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Route"
  /routes/validate:
    post:
      operationId: validateRoute
      summary: Validate a proposed route without applying it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteProposal"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Request or domain error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ApiError:
      description: Invalid request or catalog failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: alive
    Capabilities:
      type: object
      required: [apiVersion, workers]
      properties:
        apiVersion:
          type: string
        workers:
          type: array
          items:
            type: object
            required: [workerId, state, capabilities]
            properties:
              workerId:
                type: string
                format: uuid
              state:
                type: string
              capabilities:
                type: object
                additionalProperties: true
    NetworkInterface:
      type: object
      required: [stableId, name, addresses, linkUp, administrativeUp, multicastCapable]
      properties:
        stableId:
          type: string
        name:
          type: string
        addresses:
          type: array
          items:
            type: string
            format: ip-address
        mtu:
          type: integer
          minimum: 1
        linkUp:
          type: boolean
        administrativeUp:
          type: boolean
        multicastCapable:
          type: boolean
        linkSpeedBitsPerSecond:
          type: integer
          minimum: 0
    CreateSourceRequest:
      type: object
      required: [friendlyName, profile]
      properties:
        friendlyName:
          type: string
          minLength: 1
          maxLength: 120
        profile:
          $ref: "#/components/schemas/SourceMediaProfile"
    CreateDestinationRequest:
      type: object
      required: [friendlyName, profile]
      properties:
        friendlyName:
          type: string
          minLength: 1
          maxLength: 120
        profile:
          $ref: "#/components/schemas/DestinationMediaProfile"
    Source:
      type: object
      required:
        [id, friendlyName, sourceType, desiredState, currentRevision, revisionId, lifecycle, configuration]
      properties:
        id:
          type: string
          format: uuid
        friendlyName:
          type: string
        sourceType:
          type: string
        desiredState:
          type: string
          const: disabled
        currentRevision:
          type: integer
          minimum: 1
        revisionId:
          type: string
          format: uuid
        lifecycle:
          type: string
          const: draft
        configuration:
          $ref: "#/components/schemas/SourceMediaProfile"
    Destination:
      type: object
      required:
        [id, friendlyName, destinationType, desiredState, currentRevision, revisionId, lifecycle, configuration]
      properties:
        id:
          type: string
          format: uuid
        friendlyName:
          type: string
        destinationType:
          type: string
        desiredState:
          type: string
          const: disabled
        currentRevision:
          type: integer
          minimum: 1
        revisionId:
          type: string
          format: uuid
        lifecycle:
          type: string
          const: draft
        configuration:
          $ref: "#/components/schemas/DestinationMediaProfile"
    SourceMediaProfile:
      oneOf:
        - type: object
          required: [kind, device]
          properties:
            kind:
              type: string
              const: alsa_l16
            device:
              type: string
        - type: object
          required: [kind, bindAddress, port]
          properties:
            kind:
              type: string
              const: rtp_mp2t
            bindAddress:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
    DestinationMediaProfile:
      oneOf:
        - type: object
          required: [kind, address, port, payloadType]
          properties:
            kind:
              type: string
              const: rtp_l16
            address:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            payloadType:
              type: integer
              minimum: 96
              maximum: 127
        - type: object
          required: [kind, host, port, mode]
          properties:
            kind:
              type: string
              const: srt_mpeg_ts
            host:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
            mode:
              type: string
              enum: [caller, listener]
    RoutePlanRequest:
      type: object
      required: [source, destination]
      properties:
        source:
          $ref: "#/components/schemas/SourceMediaProfile"
        destination:
          $ref: "#/components/schemas/DestinationMediaProfile"
    RoutePlan:
      type: object
      required: [mediaPath]
      properties:
        mediaPath:
          type: string
          enum: [alsa_l16_to_rtp_l16, rtp_mp2t_to_srt_mpeg_ts]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, database_error, internal_error]
        message:
          type: string
    RouteProposal:
      type: object
      required: [sourceId, destinationId]
      properties:
        sourceId:
          type: string
          format: uuid
        destinationId:
          type: string
          format: uuid
        expectedRouteRevision:
          type: integer
          minimum: 0
    Route:
      type: object
      required: [destinationId, desiredState, observedState, revision]
      properties:
        destinationId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        desiredState:
          type: string
        observedState:
          type: string
        revision:
          type: integer
          minimum: 0
    ValidationResult:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        arcCode:
          type: string
        correlationId:
          type: string
          format: uuid
