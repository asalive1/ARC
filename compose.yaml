services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arc
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: ${ARC_POSTGRES_PASSWORD:?Set ARC_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      ARC_API_BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://arc:${ARC_POSTGRES_PASSWORD:?Set ARC_POSTGRES_PASSWORD in .env}@postgres:5432/arc
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARC_API_PORT:-8080}:8080"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ARC_UI_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
