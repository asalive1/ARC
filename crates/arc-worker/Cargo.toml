[package]
name = "arc-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gstreamer-runtime = [
    "dep:arc-gstreamer",
    "dep:arc-infrastructure",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "arc-worker"
path = "src/main.rs"
required-features = ["gstreamer-runtime"]

[dependencies]
arc-application = { path = "../arc-application" }
arc-domain = { path = "../arc-domain" }
arc-gstreamer = { path = "../arc-gstreamer", optional = true }
arc-infrastructure = { path = "../arc-infrastructure", optional = true }
arc-shared = { path = "../arc-shared" }
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
