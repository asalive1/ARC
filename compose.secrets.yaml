name: arc

services:
  api:
    environment:
      ARC_WORKER_CREDENTIALS_FILE: /run/secrets/worker_credentials
      ARC_WORKER_CREDENTIALS_JSON: ""
    secrets:
      - worker_credentials

  worker:
    environment:
      ARC_WORKER_CONTROL_TOKEN_FILE: /run/secrets/worker_control_token
      ARC_WORKER_CONTROL_TOKEN: ""
      ARC_WORKER_CONTROL_ENDPOINT: ${ARC_WORKER_CONTROL_ENDPOINT:?Set ARC_WORKER_CONTROL_ENDPOINT}
    secrets:
      - worker_control_token

  ingress:
    profiles:
      - worker
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARC_WORKER_TLS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx-worker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    restart: unless-stopped

secrets:
  worker_credentials:
    file: ${ARC_WORKER_CREDENTIALS_FILE_SOURCE:?Set ARC_WORKER_CREDENTIALS_FILE_SOURCE}
  worker_control_token:
    file: ${ARC_WORKER_CONTROL_TOKEN_FILE_SOURCE:?Set ARC_WORKER_CONTROL_TOKEN_FILE_SOURCE}
