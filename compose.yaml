services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arc
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: ${ARC_POSTGRES_PASSWORD:?Set ARC_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      ARC_API_BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://arc:${ARC_POSTGRES_PASSWORD:?Set ARC_POSTGRES_PASSWORD in .env}@postgres:5432/arc
      ARC_WORKER_CREDENTIALS_JSON: ${ARC_WORKER_CREDENTIALS_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "127.0.0.1:${ARC_API_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    profiles:
      - worker
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      ARC_WORKER_ID: ${ARC_WORKER_ID:-}
      ARC_WORKER_NAME: ${ARC_WORKER_NAME:-arc-worker-local}
      ARC_WORKER_CONTROL_ENDPOINT: ${ARC_WORKER_CONTROL_ENDPOINT:-}
      ARC_WORKER_CONTROL_TOKEN: ${ARC_WORKER_CONTROL_TOKEN:-}
      ARC_WORKER_CAPACITY_UNITS: ${ARC_WORKER_CAPACITY_UNITS:-2}
      ARC_WORKER_INGRESS_BITS_PER_SECOND: ${ARC_WORKER_INGRESS_BITS_PER_SECOND:-}
      ARC_WORKER_EGRESS_BITS_PER_SECOND: ${ARC_WORKER_EGRESS_BITS_PER_SECOND:-}
      ARC_WORKER_CPU_UTILIZATION_RATIO: ${ARC_WORKER_CPU_UTILIZATION_RATIO:-}
      ARC_WORKER_MEMORY_UTILIZATION_RATIO: ${ARC_WORKER_MEMORY_UTILIZATION_RATIO:-}
      ARC_WORKER_ENABLE_ALSA: ${ARC_WORKER_ENABLE_ALSA:-false}
      DATABASE_URL: postgres://arc:${ARC_POSTGRES_PASSWORD:?Set ARC_POSTGRES_PASSWORD in .env}@postgres:5432/arc
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s

  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
    depends_on:
      - api
    ports:
      - "127.0.0.1:${ARC_UI_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
